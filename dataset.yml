# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: area_profile
title: 地域カルテ
description: |-
  町丁目と市区町村ごとのよく使う指標（人口・年齢構成・昼間人口・将来推計人口・財政力指数・事業所・医療施設・店舗数・最寄り駅・地価）を、1 行に並べたデータセットです。地域どうしを比べたり、地図で塗ったりするときに 1 つの表で引けます。

  出典：「国勢調査」（総務省統計局、令和2年・令和7年）、「住民基本台帳人口移動報告」（総務省統計局）、「人口動態統計」「医療施設調査」（厚生労働省）、「地方財政状況調査」（総務省）、「経済センサス‐活動調査」（総務省・経済産業省、令和3年）、「日本の地域別将来推計人口（令和5年推計）」（国立社会保障・人口問題研究所）、「国土数値情報 駅別乗降客数データ」（国土交通省）、Overture Maps Foundation の Places、「不動産情報ライブラリ」（国土交通省）、「アドレス・ベース・レジストリ」（デジタル庁）。Queria が加工したものです。
keywords:
  - 地域
  - 町丁目
  - 小地域
  - 市区町村
  - 将来推計人口
  - 財政力指数
  - 人口
  - 高齢化率
  - 店舗
  - 駅
  - 地価
homepage: https://github.com/queria-io/dataset-area-profile
language: ja

