name: "area_profile"
version: "1.0.0"

profile: "area_profile"

model-paths: ["models"]
macro-paths: ["shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  area_profile:
    +database: area_profile
    +materialized: table
    # 地域コードから 1 行を引く API は DuckLake のカタログを読まず、ここで書いた Parquet を
    # Range で直接読む。1 件の問い合わせでフッター 1 回と行グループ 1 つだけを読めるよう、行グループを
    # 小さくし (DuckDB が書ける最小の 2,048 行)、町丁目の表は都道府県ごとのファイルに分ける。
    # 行グループの大きさはスキーマに付ける (dbt は __dbt_tmp に書いてから改名するので、テーブルに付けても効かない)。
    # 表はまるごと作り直す (incremental にすると削除ファイルができ、Parquet だけを読む API が消した行を返す)
    profile:
      +pre-hook:
        - "CREATE SCHEMA IF NOT EXISTS area_profile.profile"
        - "CALL area_profile.set_option('parquet_row_group_size', 2048, schema => 'profile')"
        - "CALL area_profile.set_option('parquet_compression', 'zstd', schema => 'profile')"
      # 分けて書くテーブルは 1 スレッドで書き、書き出しの区切りを行グループの倍数にして、key_code の並びを保つ
      profile_small_area:
        +partitioned_by: prefecture_code
        +pre-hook:
          - "SET threads = 1"
          - "SET partitioned_write_flush_threshold = 491520"
        +post-hook:
          - "RESET threads"
          - "RESET partitioned_write_flush_threshold"
