version: 2

models:
  - name: profile_small_area
    description: 町丁目ごとのよく使う指標を 1 行に並べた表。人口・年齢構成・店舗の種類別件数・最寄り駅・最新の地価。
    columns:
      - name: key_code
        data_tests: [unique, not_null]
      - name: prefecture_code
      - name: city_code
      - name: city_name
      - name: area_name
      - name: area_km2
      - name: population
      - name: households
      - name: population_density
      - name: population_under_15
      - name: population_15_64
      - name: population_65_over
      - name: population_75_over
      - name: aged_65_over_rate
      - name: facility_count
      - name: food_count
      - name: grocery_count
      - name: shopping_count
      - name: medical_count
      - name: education_count
      - name: nearest_station_name
      - name: nearest_station_distance_m
      - name: nearest_station_passenger_count
      - name: station_passenger_year
      - name: residential_price_year
      - name: residential_price_median
      - name: commercial_price_year
      - name: commercial_price_median
