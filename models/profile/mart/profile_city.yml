version: 2

models:
  - name: profile_city
    columns:
      - name: city_code
        data_tests: [unique, not_null]
      - name: lg_code
      - name: prefecture_code
        data_tests: [not_null]
      - name: city_name
        data_tests: [not_null]
      - name: area_level
        data_tests:
          - accepted_values:
              arguments:
                values: [city, ward, town_village]
