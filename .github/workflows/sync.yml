name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 毎月 4 日 05:00 JST。area_stats (毎月 3 日) の後に、元のデータセットの更新を取り込む
    - cron: "0 20 3 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@84cde26eceaa8beb74cce30d82da2dcb44174043
    with:
      dataset_name: area_profile
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
